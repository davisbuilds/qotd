version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # WHY: installs quarantine releases for 7 days (pnpm minimumReleaseAge).
    # Waiting one day longer keeps bumps out of that window, where the locked
    # install fails. Security updates bypass this cooldown.
    cooldown:
      default-days: 8
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
